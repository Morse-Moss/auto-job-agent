name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 简历渲染测试需要 LibreOffice（docx→pdf）与 poppler（pdf→png）；
      # 代码里 _find_executable 会回退到 PATH，Linux 下从这里取得。
      - name: 安装文档渲染依赖（LibreOffice + poppler）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice poppler-utils

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: lint + build + test（与本地/推送钩子同一套脚本）
        run: python scripts/ci.py
