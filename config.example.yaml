# 使用方法：cp config.example.yaml config.yaml 然后填写
# config.yaml 已被 .gitignore 忽略，不会被提交

ai:
  api_key: "sk-你的DeepSeek密钥"   # https://platform.deepseek.com
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

match:
  min_score: 65                    # 匹配分低于此值自动跳过（0-100）
  send_tailored_summary: false     # 打招呼后是否追发一条"定制简历要点"消息（更醒目但更激进）

resume:
  master_file: "resume/master_resume.md"
  output_dir: "output/tailored"

boss:
  keywords:                        # 搜索关键词，可配多个
    - "Python 后端"
  city: "上海"                     # 支持的城市见 jobagent/platforms/boss.py 的 CITY_CODES
  max_jobs_per_keyword: 30         # 每个关键词最多分析的岗位数
  max_apply_per_run: 20            # 单次运行最多打招呼次数（防风控，建议 ≤20）
  delay_range_seconds: [10, 25]    # 两次操作之间随机等待秒数区间
  headless: false                  # 保持 false：首次需要扫码登录
  blacklist_companies: []          # 公司黑名单（包含匹配），如 ["某某外包"]
  blacklist_keywords:              # 岗位名或JD命中任一关键词即跳过
    - "外包"
    - "驻场"
    - "劳务派遣"
